name: android
# Gera os APKs do Android e abre num emulador de verdade. Roda ao criar uma tag (v1.0.0...) ou manualmente.
#   moderno     Android 10+: PySide6 6.12 (Python 3.14 no aparelho), NDK r28c (páginas de 16 KB do Android 15)
#   compativel  Android 9+:  PySide6 6.8.3 (Python 3.11), NDK r26b; o último PySide6 cujas bibliotecas não
#               usam TLS nativo do ELF (o Android 9 não carrega: "unknown reloc type 16")
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# o token do workflow só lê o repositório
permissions:
  contents: read

jobs:
  apk:
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
        variante: [moderno, compativel]
        include:
          - {variante: moderno, pyside: "6.12.0", prefixo: pyside6, etiqueta: cp310-abi3, ndk: "28.2.13676358", api: "29", host: "3.12", p4a: ""}
          - {variante: compativel, pyside: "6.8.3", prefixo: PySide6, etiqueta: cp311-cp311, ndk: "26.1.10909125", api: "28", host: "3.11", p4a: "develop", p4a_commit: "f8e5c05889c121181f309177ed0bc7b14e896212", receitas: "ferramentas/receitas_p4a"}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.host }}
      - name: SDK, NDK, JDK 17 e as ferramentas de build do python-for-android
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool libltdl-dev pkg-config \
            m4 gettext cmake zlib1g-dev libffi-dev libssl-dev zip unzip
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${{ matrix.ndk }}" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null
          # o buildozer procura o sdkmanager em <sdk>/tools/bin; o runner tem em cmdline-tools/latest
          sudo mkdir -p "$ANDROID_HOME/tools"
          sudo ln -sfn "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/tools/bin"
          sudo ln -sfn "$ANDROID_HOME/cmdline-tools/latest/lib" "$ANDROID_HOME/tools/lib"
      - name: PySide6 de desktop (a ferramenta) e as rodas do Android
        run: |
          # jinja2, pkginfo e tqdm: a ferramenta usa e não declara
          pip install "PySide6==${{ matrix.pyside }}" buildozer cython jinja2 pkginfo tqdm packaging
          V="${{ matrix.pyside }}"
          BASE=https://download.qt.io/official_releases/QtForPython
          FIM="${{ matrix.etiqueta }}-android_${{ matrix.arch }}.whl"
          mkdir rodas
          curl -fsSL -o "rodas/PySide6-$V-$FIM" "$BASE/pyside6/${{ matrix.prefixo }}-$V-$V-$FIM"
          curl -fsSL -o "rodas/shiboken6-$V-$FIM" "$BASE/shiboken6/shiboken6-$V-$V-$FIM"
      - name: Gerar o APK
        env:
          PESTINHA_API_MINIMA: ${{ matrix.api }}
          PESTINHA_P4A: ${{ matrix.p4a }}
          PESTINHA_P4A_COMMIT: ${{ matrix.p4a_commit }}
          PESTINHA_P4A_RECEITAS: ${{ matrix.receitas }}
        run: |
          python ferramentas/gerar_android.py --name ClaudeSuperPower -f \
            --wheel-pyside rodas/PySide6-*.whl --wheel-shiboken rodas/shiboken6-*.whl \
            --ndk-path "$ANDROID_HOME/ndk/${{ matrix.ndk }}" --sdk-path "$ANDROID_HOME"
          mkdir entrega
          mv ./*.apk "entrega/ClaudeSuperPower-${{ matrix.variante }}-${{ matrix.arch }}.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: android-${{ matrix.variante }}-${{ matrix.arch }}
          path: entrega/

  rodas-32bits:
    # o Qt não publica rodas Android de 32 bits: compila o PySide6 6.8.3 (QtCore, QtGui, QtWidgets) na API 28
    strategy:
      fail-fast: false
      matrix:
        arch: [armv7a, i686]
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: NDK r26b, libclang e ferramentas de build
        run: |
          sudo apt-get update
          # libgles2-mesa-dev: num host Linux o shiboken lê os cabeçalhos do OpenGL ES do próprio host ao gerar o
          # QtGui (pyside-setup, sources/pyside6/cmake/Macros/PySideModules.cmake); sem eles, "GLES2/gl2.h" falta
          sudo apt-get install -y --no-install-recommends libclang-15-dev llvm-15-dev clang-15 ninja-build \
            autoconf automake libtool pkg-config zlib1g-dev libffi-dev libssl-dev libgles2-mesa-dev libegl-dev
          echo "LLVM_INSTALL_DIR=/usr/lib/llvm-15" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          # android-28: o pyside-tools gera as ligações Java na API alvo (android.jar dela)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" \
            "platforms;android-28" "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - name: Compilar as rodas
        run: sh ferramentas/gerar_rodas_android_32bits.sh ${{ matrix.arch }} "$ANDROID_HOME" "$ANDROID_HOME/ndk/26.1.10909125"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: rodas-android-${{ matrix.arch }}
          path: pyside-setup/dist/*.whl

  apk-32bits:
    # Android 9+ de 32 bits: as rodas compiladas acima, no mesmo esquema da variante compatível
    needs: rodas-32bits
    strategy:
      fail-fast: false
      matrix:
        arch: [armv7a, i686]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: rodas-android-${{ matrix.arch }}
          path: rodas
      - name: SDK, NDK, JDK 17 e as ferramentas de build do python-for-android
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool libltdl-dev pkg-config \
            m4 gettext cmake zlib1g-dev libffi-dev libssl-dev zip unzip
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null
          sudo mkdir -p "$ANDROID_HOME/tools"
          sudo ln -sfn "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/tools/bin"
          sudo ln -sfn "$ANDROID_HOME/cmdline-tools/latest/lib" "$ANDROID_HOME/tools/lib"
          pip install "PySide6==6.8.3" buildozer cython jinja2 pkginfo tqdm packaging
          ls rodas
      - name: Gerar o APK
        env:
          PESTINHA_API_MINIMA: "28"
          PESTINHA_P4A: develop
          PESTINHA_P4A_COMMIT: f8e5c05889c121181f309177ed0bc7b14e896212
          PESTINHA_P4A_RECEITAS: ferramentas/receitas_p4a
        run: |
          python ferramentas/gerar_android.py --name ClaudeSuperPower -f \
            --wheel-pyside "$(ls rodas/PySide6-*.whl)" --wheel-shiboken "$(ls rodas/shiboken6-*.whl)" \
            --ndk-path "$ANDROID_HOME/ndk/26.1.10909125" --sdk-path "$ANDROID_HOME"
          mkdir entrega
          mv ./*.apk "entrega/ClaudeSuperPower-32bits-${{ matrix.arch }}.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: android-32bits-${{ matrix.arch }}
          path: entrega/

  emulador:
    # o APK de cada variante no emulador: na versão mínima dela e no Android 15 (o de 32 bits num x86)
    needs: [apk, apk-32bits]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variante: moderno, api: 29, alvo: default, apk: x86_64, emu: x86_64}
          - {variante: moderno, api: 35, alvo: google_apis, apk: x86_64, emu: x86_64}
          - {variante: compativel, api: 28, alvo: default, apk: x86_64, emu: x86_64}
          - {variante: compativel, api: 35, alvo: google_apis, apk: x86_64, emu: x86_64}
          - {variante: 32bits, api: 28, alvo: default, apk: i686, emu: x86}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: android-${{ matrix.variante }}-${{ matrix.apk }}
          path: apk
      - name: KVM para o emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.emu }}
          target: ${{ matrix.alvo }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: sh ferramentas/fumaca_android.sh apk/ClaudeSuperPower-${{ matrix.variante }}-${{ matrix.apk }}.apk "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: android-emulador-${{ matrix.variante }}-api${{ matrix.api }}
          path: |
            logcat.txt
            tela.png
