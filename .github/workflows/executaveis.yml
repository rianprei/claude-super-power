name: executáveis
# Gera o executável de Windows, macOS e Linux. Roda ao criar uma tag (v1.0.0...) ou manualmente.
# Cada um é aberto aqui mesmo por alguns segundos antes de virar artefato (teste de fumaça).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# o token do workflow só lê o repositório
permissions:
  contents: read

jobs:
  executavel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, nome: windows-x64, reqs: requirements.txt}
          - {os: windows-11-arm, nome: windows-arm64, reqs: requirements.txt}
          # macOS: o mínimo é conferido binário por binário (ferramentas/minimo_macos.py)
          - {os: macos-latest, nome: macos-apple-silicon, reqs: requirements.txt, macos_min: "15.0", arch: arm64}
          - {os: macos-15-intel, nome: macos-intel, reqs: requirements.txt, macos_min: "15.0", arch: x86_64}
          # macOS 10.14 a 14: Intel, e Apple Silicon pelo Rosetta
          - {os: macos-15-intel, nome: macos-compativel, reqs: requirements-macos-compativel.txt, macos_min: "10.14", arch: x86_64}
          - {os: ubuntu-latest, nome: linux, reqs: requirements.txt}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - run: pip install -r ${{ matrix.reqs }} pyinstaller==6.22.3
      - name: "Linux: biblioteca EGL (PySide6)"
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1
      - name: "macOS: numpy da versão mínima do macOS"
        # num macOS novo o pip escolhe a roda do numpy feita para o macOS 14, que não abre nos anteriores
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSAO="$(python -c 'import numpy; print(numpy.__version__)')"
          PLATAFORMA="macosx_$(printf '%s' '${{ matrix.macos_min }}' | tr . _)_${{ matrix.arch }}"
          pip download "numpy==$VERSAO" --no-deps --only-binary=:all: --platform "$PLATAFORMA" \
            --python-version 3.11 -d rodas
          pip install --force-reinstall --no-deps rodas/numpy-*.whl
      - name: Gerar o executável
        shell: bash
        run: |
          MODO="--onefile"
          EXTRA=""
          SEP=":"
          case "$RUNNER_OS" in
            Windows) EXTRA="--windowed --hidden-import win32timezone"; SEP=";" ;;
            macOS) MODO="--onedir"; EXTRA="--windowed --osx-bundle-identifier io.github.rianprei.claudesuperpower" ;;
          esac
          # assets/ e pets/ vão também dentro do executável: baixado sozinho, ele ainda tem os pets
          # (os caminhos de --add-data são relativos à pasta do .spec, build/)
          python -m PyInstaller --noconfirm $MODO $EXTRA --name Pestinha \
            --add-data "../assets${SEP}assets" --add-data "../pets${SEP}pets" \
            --distpath dist --workpath build/work --specpath build main.py
      - name: "macOS: conferir a versão mínima de cada binário"
        if: runner.os == 'macOS'
        run: python ferramentas/minimo_macos.py dist/Pestinha.app ${{ matrix.macos_min }} ${{ matrix.arch }}
      - name: Teste de fumaça (abre, roda 8 s e fecha)
        shell: bash
        timeout-minutes: 3
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            dist/Pestinha.app/Contents/MacOS/Pestinha --direto --sair-em 8
            ls "$HOME/Library/Application Support/Claude Super Power/memory/pets"
          else
            # sozinho numa pasta vazia: usa os pets de dentro do executável e grava a memory/ ao lado
            mkdir fumaca && cp dist/Pestinha* fumaca/ && cd fumaca
            if [ "$RUNNER_OS" = "Linux" ]; then export QT_QPA_PLATFORM=offscreen; fi
            ./Pestinha* --direto --sair-em 8
            ls memory/pets
          fi
      - name: Montar a entrega
        shell: bash
        run: |
          mkdir entrega
          case "$RUNNER_OS" in
            # ditto guarda os links e as permissões de dentro do .app (o zip do artefato perderia)
            macOS) ditto -c -k --keepParent dist/Pestinha.app "entrega/Pestinha-${{ matrix.nome }}.zip" ;;
            Linux)
              mkdir pestinha && cp -R dist/Pestinha assets pets pestinha/
              tar -czf "entrega/Pestinha-${{ matrix.nome }}.tar.gz" pestinha ;;
            *) cp -R dist/Pestinha.exe assets pets entrega/ ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pestinha-${{ matrix.nome }}
          path: entrega/
