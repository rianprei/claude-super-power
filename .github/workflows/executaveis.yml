name: executáveis
# Gera o executável de Windows, macOS e Linux. Roda ao criar uma tag (v1.0.0...) ou manualmente.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# o token do workflow só lê o repositório
permissions:
  contents: read

jobs:
  executavel:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest, ubuntu-latest]     # Windows em x64 e em ARM64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller==6.22.3
      - name: Gerar o executável
        shell: bash
        run: |
          EXTRA=""
          SEP=":"
          if [ "$RUNNER_OS" = "Windows" ]; then EXTRA="--windowed --hidden-import win32timezone"; SEP=";"; fi
          # assets/ e pets/ vão também dentro do executável: baixado sozinho, ele ainda tem os pets
          # (os caminhos de --add-data são relativos à pasta do .spec, build/)
          python -m PyInstaller --noconfirm --onefile $EXTRA --name Pestinha \
            --add-data "../assets${SEP}assets" --add-data "../pets${SEP}pets" \
            --distpath dist --workpath build/work --specpath build main.py
      - name: Montar a pasta de entrega (executável + assets + pets)
        shell: bash
        run: |
          # Bash 3.2 no macOS não suporta a expansão ${VAR,,}.
          SISTEMA="$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          PASTA="executáveis/$SISTEMA"
          mkdir -p "$PASTA"
          cp -R dist/Pestinha* "$PASTA/"
          cp -R assets pets "$PASTA/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pestinha-${{ matrix.os }}
          path: executáveis/
